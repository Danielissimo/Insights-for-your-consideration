  text-align:center;
  font:inherit;
  font-size:clamp(18px,3vw,24px);
  outline:none;
  padding:8px 4px;
}
button {
  margin-top:22px;
  background:none;
  border:none;
  color:#fff;
  font:inherit;
  font-size:15px;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
}
#error {
  display:none;
  margin-top:24px;
  font-size:clamp(19px,3vw,26px);
  line-height:1.45;
}
#error a {
  color:#fff;
  text-decoration:underline;
  text-underline-offset:5px;
}
.small { font-style:italic; }
</style>
</head>
<body>
<main class="wrap">
  <div class="enso">
    <div class="center">
      <h1>What does an Insight<br>invite?</h1>
      <form id="gate">
        <input id="answer" aria-label="Your answer" autocomplete="off" autofocus>
        <br><button type="submit">Enter</button>
      </form>
      <div id="error">
        <a href="#" id="again">Consider again.</a><br>
        <span class="small">…or not.</span>
      </div>
    </div>
  </div>
</main>
<script>
const gate = document.getElementById('gate');
const answer = document.getElementById('answer');
const error = document.getElementById('error');
const again = document.getElementById('again');

gate.addEventListener('submit', e => {
  e.preventDefault();
  if (answer.value.toLowerCase().includes('reflection')) {
    document.body.style.transition = 'opacity .7s ease';
    document.body.style.opacity = '0';
    setTimeout(() => location.href='/', 650);
  } else {
    gate.style.display = 'none';
    error.style.display = 'block';
  }
});

again.addEventListener('click', e => {
  e.preventDefault();
  error.style.display = 'none';
  gate.style.display = 'block';
  answer.value = '';
  answer.focus();
});
</script>
</body>
</html>
